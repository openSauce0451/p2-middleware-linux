[package]
name = "p2-bridge-core"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "p2-bridge"
path = "src/main.rs"

[features]
default = ["web-auth"]
web-auth = ["dep:reqwest", "dep:qrcode"]

[dependencies]
aes = "=0.8.4"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"
crc32fast = "=1.5.0"
flate2 = "=1.1.9"
hmac = "=0.12.1"
sha1 = "=0.10.6"
sha2 = "0.10"
spake2 = "0.3"
rsa = "=0.9.10"
subtle = "=2.6.1"
zeroize = "=1.9.0"
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["blocking", "json", "form", "native-tls"] }
qrcode = { version = "=0.14.1", optional = true, default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
